packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true

# Pinned once, consumed everywhere via `catalog:` in package.json dependencies.
# Section 5 of the technical report: "Pin exact or compatible major versions.
# Do not blindly use 'latest' in production."
catalog:
  # --- Web (verified against npm registry 2026-08-23) ---
  next: 16.3.2
  react: 19.2.8
  react-dom: 19.2.8
  '@tanstack/react-query': ^5.90.5
  'react-hook-form': ^7.65.0

  # --- API / worker ---
  fastify: ^5.12.1
  '@fastify/cookie': ^11.0.2
  '@fastify/cors': ^11.1.0
  '@fastify/helmet': ^13.0.2
  '@fastify/rate-limit': ^10.3.0
  bullmq: ^6.2.0
  ioredis: ^5.9.0
  pino: ^10.3.1
  'pino-pretty': ^13.1.2

  # --- Data ---
  prisma: 7.9.1
  '@prisma/client': 7.9.1

  # --- Shared ---
  # TS 7.0.2 is the current `latest` but typescript-eslint@8 declares
  # `typescript: >=4.8.4 <6.1.0`, so 5.9.3 is the newest lintable line. See ADR-011.
  typescript: 5.9.3
  zod: ^4.4.3

  # --- Testing ---
  vitest: ^4.1.11
  '@playwright/test': ^1.62.1

  # --- Tooling ---
  eslint: ^10.9.0
  'typescript-eslint': ^8.67.0
  tsx: ^4.20.6

# pnpm blocks postinstall scripts by default. These three need them:
# Prisma downloads/patches its query engine, esbuild fetches its native binary.
onlyBuiltDependencies:
  - '@prisma/engines'
  - prisma
  - esbuild
